<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3a2416" />
    <title>Nusa Sorting</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1f120a;
        overscroll-behavior: none;
        touch-action: none;
      }
      /* No text selection, magnifier or long-press menu anywhere on the page (CrazyGames asks for it on body). */
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* The warung at sunset while the game loads (the bundle, then its first resources); the game removes it. */
      #loading {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
        transition: opacity 0.22s ease-out;
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <img id="loading" src="/src/assets/art/loading.webp" alt="" />
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
