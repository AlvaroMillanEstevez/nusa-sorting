<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3a2416" />
    <title>Nusa: Warung Sort</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1f120a;
        overscroll-behavior: none;
        touch-action: none;
      }
      /*
       * No text selection, magnifier or long-press menu anywhere on the page (CrazyGames asks for it on body, with
       * the -webkit-, -moz- and -ms- prefixes). The build's CSS minifier drops the -moz- and -ms- ones as obsolete,
       * so the body's own style attribute repeats them all.
       */
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /*
       * The warung at sunset while the game loads (the bundle, then its first resources), with the title over the
       * street; the game removes it. The title is the map's: "Nusa", the brand, small over "Warung Sort", in the
       * game's display font (bundled) and colours (SKIN in src/ui/design/tokens.ts).
       */
      @font-face {
        font-family: 'NusaDisplay';
        font-weight: 600;
        font-display: block;
        src: url('/src/assets/fonts/nusa-display-600.woff2') format('woff2');
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        transition: opacity 0.22s ease-out;
        background: #1f120a;
      }
      #loading img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #loading-title {
        position: absolute;
        left: 0;
        right: 0;
        top: 30%;
        text-align: center;
        font-family: 'NusaDisplay', 'Trebuchet MS', sans-serif;
        font-weight: 600;
        line-height: 1;
        color: #fff4e0;
        /* The dark wooden outline, as on the map: sixteen shadows round the letters, then a soft drop shadow. */
        text-shadow:
          0.095em 0.000em 0 #2e1b0d,
          0.088em 0.037em 0 #2e1b0d,
          0.066em 0.066em 0 #2e1b0d,
          0.037em 0.088em 0 #2e1b0d,
          0.000em 0.095em 0 #2e1b0d,
          -0.037em 0.088em 0 #2e1b0d,
          -0.066em 0.066em 0 #2e1b0d,
          -0.088em 0.037em 0 #2e1b0d,
          -0.095em 0.000em 0 #2e1b0d,
          -0.088em -0.037em 0 #2e1b0d,
          -0.066em -0.066em 0 #2e1b0d,
          -0.037em -0.088em 0 #2e1b0d,
          -0.000em -0.095em 0 #2e1b0d,
          0.037em -0.088em 0 #2e1b0d,
          0.066em -0.066em 0 #2e1b0d,
          0.088em -0.037em 0 #2e1b0d,
          0 0.14em 0.16em rgba(0, 0, 0, 0.5);
      }
      #loading-title .brand {
        display: block;
        font-size: clamp(20px, 5.5vmin, 36px);
        color: #ffc95a;
        margin-bottom: 0.15em;
      }
      #loading-title .name {
        display: block;
        font-size: clamp(40px, 12vmin, 76px);
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body style="-webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none">
    <div id="loading">
      <img src="/src/assets/art/loading.webp" alt="" />
      <div id="loading-title"><span class="brand">Nusa</span><span class="name">Warung Sort</span></div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
